    <circle cx="85" cy="39.5" r="1.5" stroke="none" />
    <circle cx="79.5" cy="44.5" r="2" stroke="none" />
    <path d="M74 52.5 C73 54 71.5 53.5 70.8 52 C70 50.5 71.2 49.5 72.5 49.8 C73.5 50.2 74.5 51.2 74 52.5 Z" stroke="none" />
