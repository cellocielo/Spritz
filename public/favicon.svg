<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Spritz Brand Atomizer Icon - Transparent background with luxury vibrant orange -->
  <g stroke="#f97316" fill="#f97316">
    <!-- Base Pedestal -->
    <path 
      d="M42 81.5 C45 82.5 59 82.5 62 81.5" 
      stroke-width="3.2" 
      stroke-linecap="round" 
      fill="none"
    />

    <!-- Spherical Crystal Perfume Flacon -->
    <circle 
      cx="52" 
      cy="62" 
      r="17.5" 
      stroke-width="3.2" 
      stroke-linecap="round" 
      fill="none"
    />

    <!-- Internal Liquid Essence Meniscus -->
    <path 
      d="M37.5 64 C42 67.5 62 67.5 66.5 64" 
      stroke-width="1.8" 
      stroke-linecap="round" 
      opacity="0.35" 
      fill="none"
    />

    <!-- Center Dip Tube -->
    <line 
      x1="52" 
      y1="44" 
      x2="52" 
      y2="71" 
      stroke-width="2.2" 
      stroke-linecap="round" 
      opacity="0.5" 
    />

    <!-- Sprayer Collar Mount -->
    <rect 
      x="48" 
      y="40.5" 
      width="8" 
      height="4" 
      rx="1" 
      stroke="none"
    />

    <!-- Atomizer Pump Head -->
    <path 
      d="M47 40.5 L57 40.5 L56 35 C56 34 55 33.5 54 33.5 L50 33.5 C49 33.5 48 34 48 35 Z" 
      stroke="none"
    />

    <!-- Spray Orifice Nozzle Tip -->
    <rect 
      x="56.5" 
      y="35.5" 
      width="5.5" 
      height="3" 
      rx="1" 
      stroke="none"
    />

    <!-- Atomizer Delivery Tube -->
    <path 
      d="M47 37 C36 37 25 39.5 25 48" 
      stroke-width="3.2" 
      stroke-linecap="round" 
      fill="none" 
    />

    <!-- Vintage Atomizer Squeeze Bulb -->
    <ellipse 
      cx="25" 
      cy="58" 
      rx="8.5" 
      ry="11.5" 
      stroke-width="3.2" 
      fill="#f97316" 
      fill-opacity="0.15" 
    />

    <!-- Decorative Bulb Tassel -->
    <path 
      d="M25 69.5 L25 76" 
      stroke-width="2.4" 
      stroke-linecap="round" 
      fill="none"
    />
    <circle 
      cx="25" 
      cy="78.5" 
      r="1.6" 
      stroke="none"
    />

    <!-- Airy Radiant Spritz Mist -->
    <!-- Upper Mist Trail & Droplet -->
    <path 
      d="M67 32.5 C72 28.5 78 26 84 25.5" 
      stroke-width="2.4" 
      stroke-linecap="round" 
      fill="none"
    />
    <circle cx="90.5" cy="26" r="2.2" stroke="none" />

    <!-- Central Direct Mist Stream & Hero Droplet -->
    <line 
      x1="68" 
      y1="37" 
      x2="81" 
      y2="37" 
      stroke-width="2.6" 
      stroke-linecap="round" 
    />
    <circle cx="88" cy="37" r="2.8" stroke="none" />

    <!-- Lower Mist Trail & Droplet -->
    <path 
      d="M67 41.5 C72 45.5 78 48 84 48.5" 
      stroke-width="2.4" 
      stroke-linecap="round" 
      fill="none"
    />
    <circle cx="90.5" cy="48" r="2.2" stroke="none" />

    <!-- Effervescent Ambient Scent Particles -->
    <circle cx="76.5" cy="21" r="1.5" stroke="none" opacity="0.8" />
    <circle cx="76.5" cy="53" r="1.5" stroke="none" opacity="0.8" />
    <circle cx="95.5" cy="37" r="1.6" stroke="none" opacity="0.8" />
  </g>
